name: PlanetLS critical E2E

on:
  workflow_dispatch:
  pull_request:

jobs:
  critical-workspaces:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
      TARGET_EMAIL: ${{ secrets.E2E_TARGET_EMAIL }}
      WORKSPACE_PASSWORD: ${{ secrets.E2E_WORKSPACE_PASSWORD }}
      E2E_STRIPE_SECRET_KEY: ${{ secrets.E2E_STRIPE_SECRET_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Verify required secrets
        shell: bash
        run: |
          test -n "$NEXT_PUBLIC_SUPABASE_URL" || (echo "Missing NEXT_PUBLIC_SUPABASE_URL" && exit 1)
          test -n "$NEXT_PUBLIC_SUPABASE_ANON_KEY" || (echo "Missing NEXT_PUBLIC_SUPABASE_ANON_KEY" && exit 1)
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || (echo "Missing SUPABASE_SERVICE_ROLE_KEY" && exit 1)
          test -n "$NEXTAUTH_SECRET" || (echo "Missing NEXTAUTH_SECRET" && exit 1)
          test -n "$TARGET_EMAIL" || (echo "Missing E2E_TARGET_EMAIL" && exit 1)
          test -n "$WORKSPACE_PASSWORD" || (echo "Missing E2E_WORKSPACE_PASSWORD" && exit 1)
          case "$E2E_STRIPE_SECRET_KEY" in sk_test_*) ;; *) echo "Missing or non-test E2E_STRIPE_SECRET_KEY"; exit 1 ;; esac

      - name: Install dependencies
        run: npm ci

      - name: Run unit and contract tests
        run: npm test

      - name: Check migration governance
        run: npm run check:migrations

      - name: Run lint
        run: npm run lint

      - name: Build production application
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run critical workspace journeys
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 14
