name: PlanetLS technical checks

on:
  pull_request:
  workflow_dispatch:
    inputs:
      run_local_e2e:
        description: Run connected checks on disposable local Supabase (requires complete bootstrap)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: local-build-placeholder
      SUPABASE_SERVICE_ROLE_KEY: local-build-placeholder
      NEXTAUTH_SECRET: ci-build-only-not-a-deployed-secret
      WORKSPACE_QUICK_LOGIN_ENABLED: 'false'
      UPDATE_UI_SNAPSHOTS: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run check:migrations
      - run: npm run check:encoding
      - run: npm run development:check
      - run: npm run lint
      - run: npm run build

  local-e2e:
    if: github.event_name == 'workflow_dispatch' && inputs.run_local_e2e
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          version: 2.40.7
      - name: Require canonical bootstrap before creating a test database
        run: test -f supabase/migrations/20260219120000_bootstrap_legacy_core_schema.sql
      - run: supabase start
      - run: npm run test:registration:local
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:local
      - name: Remove disposable Supabase containers and volumes
        if: always()
        run: supabase stop --no-backup
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: isolated-security-and-e2e
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 14
